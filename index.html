<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Task List</title>
    <style>
        header {
            background-color: #008080;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            color: white;
        }

        .logo {
            height: 120px;
            margin-right: 20px;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }
        h1 {
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        #loading {
            text-align: center;
            display: none;
        }
        #cardContainer {
            margin-top: 20px;
        }
        #noTasksMessage {
            color: red;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            border: 1px solid #ccc;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }
        .popup button {
            margin-top: 10px;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://www.bharatbiotech.com/images/bharat-biotech-logo.jpg" alt="Company Logo" class="logo">
    </header>

    <div class="container">
        <h1>Employee Task List</h1>

        <div id="loading">Loading tasks...</div>

        <div style="text-align: center; margin-bottom: 20px;">
            <label for="monthSelect">Select Month:</label>
            <select id="monthSelect" onchange="fetchTasksForEmployee(employeeId)">
                <option value="">All</option>
                <option value="01">January</option>
                <option value="02">February</option>
                <option value="03">March</option>
                <option value="04">April</option>
                <option value="05">May</option>
                <option value="06">June</option>
                <option value="07">July</option>
                <option value="08">August</option>
                <option value="09">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
        </div>

        <div id="cardContainer"></div>
        <div id="noTasksMessage">No tasks found for the Employee ID.</div>

        <div id="buttonContainer" style="display: flex; margin-top: 20px;">
            <button id="editButton" style="margin-right: 10px;" onclick="showAddPopup()">Add Task</button>
            <button id="editButton1" onclick="showRemovePopup()">Remove Task</button>
        </div>

        <div id="addPopup" class="popup">
            <h3>Add New Task</h3>
            <form id="taskForm" action="https://bi3hh9apo0.execute-api.ap-south-1.amazonaws.com/S1/Addtask" method="POST" enctype="application/x-www-form-urlencoded">
                <label for="employeeid">Employee ID:</label>
                <input type="text" id="employeeID" name="eID" required><br><br>
                <label for="employeeName">Employee Name:</label>
                <input type="text" id="employeeName" name="eName" required><br><br>
                <label for="taskDescription">Task:</label>
                <input type="text" id="taskDescription" name="TaskDescription" required><br><br>
                <label for="StartDate">Start Date:</label>
                <input type="date" id="StartDate" name="StartDate"><br><br>
                <label for="EndDate">End Date:</label>
                <input type="date" id="EndDate" name="EndDate"><br><br>
                <button type="submit">Add</button>
                <button type="button" onclick="closePopup('addPopup')">Cancel</button>
            </form>
        </div>

        <div id="removePopup" class="popup">
            <h3>Remove Task</h3>
            <table id="popupTable">
                <thead>
                    <th>Employee ID</th>
                    <th>Employee Name</th>
                    <th>Task Description</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Rating</th>
                    <th>Remarks</th>
                </thead>
                <tbody id="popupTaskList"></tbody>
            </table>
            <button onclick="closePopup('removePopup')">Close</button>
        </div>

        <div id="overlay" class="overlay" onclick="closeOverlay()"></div>
        <div id="messagePopup" class="popup">
            <p id="messageContent"></p>
            <button onclick="closePopup('messagePopup')">Close</button>
        </div>
    </div>

    <script>
        const employeeId = '10005315';

        window.onload = function() {
            fetchTasksForEmployee(employeeId);
        };

        function fetchTasksForEmployee(employeeId) {
            const selectedMonth = document.getElementById('monthSelect').value;
            const apiUrl = `https://imf44ag3d4.execute-api.ap-south-1.amazonaws.com/S1/Test5?EmployeeID=${encodeURIComponent(employeeId)}${selectedMonth ? `&Month=${selectedMonth}` : ''}`;
            document.getElementById('loading').style.display = 'block';

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok ' + response.statusText);
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    const cardContainer = document.getElementById('cardContainer');

                    if (data.trim() !== '') {
                        cardContainer.innerHTML = data;
                        document.getElementById('editButton').style.display = 'block';
                        document.getElementById('editButton1').style.display = 'block';
                    } else {
                        cardContainer.innerHTML = '';
                        document.getElementById('noTasksMessage').style.display = 'block';
                        document.getElementById('editButton').style.display = 'none';
                        document.getElementById('editButton1').style.display = 'none';
                    }
                })
                .catch(error => {
                    console.error('Error fetching tasks:', error);
                    document.getElementById('loading').innerHTML = 'Error loading tasks. Please try again later.';
                });
        }

        function showAddPopup() {
            document.getElementById('addPopup').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function showRemovePopup() {
            populatePopupTable();
            document.getElementById('removePopup').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closePopup(popupId) {
            document.getElementById(popupId).style.display = 'none';
            closeOverlay();
        }

        function closeOverlay() {
            document.getElementById('overlay').style.display = 'none';
        }

        async function triggerQuickSightRefresh() {
            const apiUrl = 'https://bu2skwmyel.execute-api.ap-south-1.amazonaws.com/Q1/refresh'; // Replace with your actual endpoint

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok: ' + response.statusText);
                }

                const data = await response.json();
                console.log('QuickSight refresh initiated:', data);
            } catch (error) {
                console.error('Error triggering QuickSight refresh:', error);
            }
        }

        document.getElementById('taskForm').onsubmit = async function(event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);
            const params = new URLSearchParams(formData).toString();

            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    headers: {
                        'Content-Type': form.enctype
                    },
                    body: params
                });

                const result = await response.json();
                document.getElementById('messageContent').innerText = result.message;
                document.getElementById('messagePopup').style.display = 'block';
                document.getElementById('addPopup').style.display = 'none';
                closeOverlay();

                // Trigger QuickSight refresh after adding a task
                await triggerQuickSightRefresh();

                // Re-fetch tasks after adding
                fetchTasksForEmployee(employeeId);
            } catch (error) {
                console.error('Error adding task:', error);
                document.getElementById('messageContent').innerText = 'Failed to add task.';
                document.getElementById('messagePopup').style.display = 'block';
            }
        };

        const removeTask = async (employeeName, taskDescription) => {
            const apiUrl = 'https://oje3cr7sy2.execute-api.ap-south-1.amazonaws.com/V1/RemoveTask';
            const plainText = `${employeeName},${taskDescription}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'text/plain',
                    },
                    body: plainText
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok: ' + response.statusText);
                }

                const data = await response.json();
                document.getElementById('messageContent').innerText = data.message || 'Task removed successfully.';
                document.getElementById('messagePopup').style.display = 'block';
                closePopup('removePopup');

                // Trigger QuickSight refresh after removing a task
                await triggerQuickSightRefresh();

                fetchTasksForEmployee(employeeId);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('messageContent').innerText = 'Request failed: ' + error.message;
                document.getElementById('messagePopup').style.display = 'block';
            }
        };

        function populatePopupTable() {
            const tableBody = document.querySelector('#cardContainer table tbody');
            const popupTaskList = document.getElementById('popupTaskList');

            if (!tableBody) {
                console.error('Table body not found.');
                return;
            }

            popupTaskList.innerHTML = '';

            const rows = tableBody.querySelectorAll('tr');
            rows.forEach(row => {
                const clonedRow = row.cloneNode(true);
                const removeButtonCell = document.createElement('td');

                const employeeName = clonedRow.children[1].innerText;
                const taskDescription = clonedRow.children[2].innerText;

                removeButtonCell.innerHTML = `<button onclick="removeTask('${employeeName}', '${taskDescription}')">X</button>`;
                
                clonedRow.appendChild(removeButtonCell);
                popupTaskList.appendChild(clonedRow);
            });
        }
    </script>
</body>
</html>
